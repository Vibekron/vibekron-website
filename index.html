<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d14">
  <meta name="description" content="Vibekron is an independent software studio building thoughtful software, simulations and digital experiences.">
  <meta property="og:title" content="Vibekron — Engineering what's next.">
  <meta property="og:description" content="Independent software studio. Coming soon.">
  <meta property="og:type" content="website">
  <title>Vibekron — Coming Soon</title>
  <style>
    :root{color-scheme:dark;--bg:#090d14;--fg:#f5f7fb;--muted:#a3adbd;--line:#263143;--accent:#8eb7f4}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{margin:0;min-height:100svh;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 48% at 50% 44%,rgba(46,78,130,.19),transparent 78%),radial-gradient(ellipse 40% 30% at 88% 0%,rgba(33,54,89,.13),transparent 80%)}
    .shell{position:relative;min-height:100svh;max-width:1440px;margin:auto;padding:clamp(24px,4vw,58px);display:flex;flex-direction:column}
    header,footer{display:flex;justify-content:space-between;align-items:center;gap:20px}
    .wordmark{font-size:clamp(18px,2vw,23px);font-weight:750;letter-spacing:.14em;text-decoration:none;color:var(--fg)}
    .wordmark span{color:var(--accent)}
    .eyebrow,.top-label,.status,.footer-note{font-size:11px;letter-spacing:.19em;text-transform:uppercase;font-weight:650}
    .top-label,.footer-note{color:#8391a7}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 0}
    .eyebrow{color:var(--accent);margin:0 0 26px}
    h1{font-size:clamp(42px,7vw,94px);line-height:1.07;letter-spacing:-.065em;font-weight:650;margin:0;max-width:1100px;text-wrap:balance}
    .intro{color:var(--muted);font-size:clamp(16px,1.7vw,20px);line-height:1.7;max-width:610px;margin:30px 0 38px;text-wrap:pretty}
    .status{display:inline-flex;align-items:center;gap:11px;padding:14px 19px;border:1px solid #35445b;border-radius:100px;color:#d8e3f3;background:rgba(19,29,45,.65)}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 15px rgba(142,183,244,.7);animation:pulse 2.5s ease-in-out infinite}
    footer{border-top:1px solid var(--line);padding-top:24px;flex-wrap:wrap}
    footer a{color:#c6d4e9;text-decoration:none;font-size:13px}
    footer a:hover,footer a:focus-visible{text-decoration:underline}
    @keyframes pulse{50%{opacity:.4;box-shadow:0 0 4px rgba(142,183,244,.25)}}
    @media(prefers-reduced-motion:reduce){.dot{animation:none}}
    @media(max-width:540px){.top-label{display:none}.shell{padding:24px}main{padding:90px 0}h1{letter-spacing:-.045em}.intro{margin:24px 0 32px}footer{justify-content:center;text-align:center}.footer-note{width:100%}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="wordmark" href="/" aria-label="Vibekron home">VIBEKRON<span>.</span></a>
      <span class="top-label">Independent software studio</span>
    </header>
    <main>
      <p class="eyebrow">Software · Simulation · Digital Experiences</p>
      <h1>Engineering<br>what's next.</h1>
      <p class="intro">We build software, simulations and digital experiences driven by curiosity, craft and precision. Something new is taking shape.</p>
      <div class="status"><span class="dot" aria-hidden="true"></span>Coming soon</div>
    </main>
    <footer>
      <span class="footer-note">© <span id="year">2026</span> Vibekron</span>
      <a href="mailto:hello@vibekron.com">hello@vibekron.com</a>
    </footer>
  </div>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
